openapi: 3.0.3
info:
  title: Marketplace API
  version: 1.0.0

servers:
  - url: http://localhost:8080

security:
  - bearerAuth: []

tags:
  - name: products

paths:
  /products:
    post:
      tags: [products]
      operationId: createProduct
      summary: Создание товара
      description: "Роли: SELLER, ADMIN"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    get:
      tags: [products]
      operationId: listProducts
      summary: Список товаров с пагинацией и фильтрацией
      description: "Роли: USER, SELLER, ADMIN"
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ProductStatus"
        - name: category
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /products/{id}:
    parameters:
      - $ref: "#/components/parameters/ProductId"

    get:
      tags: [products]
      operationId: getProduct
      summary: Получение товара по ID
      description: "Роли: USER, SELLER, ADMIN"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ProductNotFound"

    put:
      tags: [products]
      operationId: updateProduct
      summary: Обновление товара
      description: "Роли: SELLER (свои), ADMIN (любые)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ProductNotFound"

    delete:
      tags: [products]
      operationId: deleteProduct
      summary: Мягкое удаление (status = ARCHIVED)
      description: "Роли: SELLER (свои), ADMIN (любые)"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ProductNotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ProductId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    ProductStatus:
      type: string
      enum: [ACTIVE, INACTIVE, ARCHIVED]

    ProductCreate:
      type: object
      additionalProperties: false
      required: [name, price, stock, category, status]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 4000
          nullable: true
        price:
          type: number
          format: decimal
          minimum: 0.01
          x-go-type: decimal.Decimal
          x-go-type-import:
            path: github.com/shopspring/decimal
        stock:
          type: integer
          format: int32
          minimum: 0
        category:
          type: string
          minLength: 1
          maxLength: 100
        status:
          $ref: "#/components/schemas/ProductStatus"

    ProductUpdate:
      type: object
      additionalProperties: false
      required: [name, price, stock, category, status]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 4000
          nullable: true
        price:
          type: number
          format: decimal
          minimum: 0.01
          x-go-type: decimal.Decimal
          x-go-type-import:
            path: github.com/shopspring/decimal
        stock:
          type: integer
          format: int32
          minimum: 0
        category:
          type: string
          minLength: 1
          maxLength: 100
        status:
          $ref: "#/components/schemas/ProductStatus"

    ProductResponse:
      type: object
      required: [id, name, description, price, stock, category, status, seller_id, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: number
          format: decimal
          x-go-type: decimal.Decimal
          x-go-type-import:
            path: github.com/shopspring/decimal
        stock:
          type: integer
          format: int32
        category:
          type: string
        status:
          $ref: "#/components/schemas/ProductStatus"
        seller_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProductPage:
      type: object
      required: [content, totalElements, page, size]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/ProductResponse"
        totalElements:
          type: integer
          format: int64
        page:
          type: integer
        size:
          type: integer

    Error:
      type: object
      required: [error_code, message]
      properties:
        error_code:
          type: string
        message:
          type: string
        details:
          type: object
          nullable: true
          additionalProperties: true

  responses:
    ValidationError:
      description: VALIDATION_ERROR
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: TOKEN_INVALID / TOKEN_EXPIRED
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: ACCESS_DENIED
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ProductNotFound:
      description: PRODUCT_NOT_FOUND
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
